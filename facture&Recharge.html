<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Recharge & Factures</title>
</head>

<body class="bg-[#45A5E0] min-h-screen w-full overflow-x-hidden">
    <main
        class="hidden lg:flex w-[90%] min-h-[95vh] absolute top-[3%] left-[5%] rounded-[2vw] overflow-hidden bg-white shadow-xl">
        <!-- Sidebar -->
        <nav class="w-[15%] min-h-[100vh] p-[1%] bg-black">
            <ul class="h-full grid grid-cols-3 grid-rows-16 justify-center gap-4">
                <li class="row-end-1 col-span-3 text-center">
                    <img src="/images/OIP_10-removebg-preview.png" alt="">
                </li>
                <li
                    class="row-end-3  col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="home.html">Home</a>
                </li>
                <li
                    class="row-end-5 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors  cursor-pointer">
                    <a href="Historique.html">Historique</a>
                </li>
                <li
                    class="row-end-7 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="cardes.html">Cards</a>
                </li>
                <li
                    class="row-end-9 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="facture&Recharge.html">Factures & Recharge</a>
                </li>
                <li
                    class="row-end-11 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="transactions.html">Transactions</a>
                </li>
                <li
                    class="row-end-13 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="profile1.html">Profile</a>
                </li>
            </ul>
        </nav>

        <!-- Main section -->
        <section class="w-[85%] p-8 flex flex-col gap-10 overflow-y-auto">
            <h1 class="text-3xl font-bold">Recharge & Factures</h1>

            <!-- Recharge -->
            <section>
                <h2 class="text-2xl font-semibold mb-4">Recharge</h2>

                <!-- Operator buttons -->
                <div class="flex gap-4 mb-4">
                    <button id="btnOrange" class="opBtn px-4 py-1 rounded hover:text-orange-500">Orange</button>
                    <button id="btnIAM" class="opBtn px-4 py-1 rounded hover:text-blue-500">IAM</button>
                    <button id="btnInwi" class="opBtn px-4 py-1 rounded hover:text-fuchsia-500">Inwi</button>
                </div>

                <!-- Recharge form -->
                <div class="bg-gradient-to-r from-blue-300 to-blue-600 shadow-lg rounded-2xl p-6 w-[70%] bg-white">
                    <form id="rechargeForm" class="grid grid-cols-2 gap-6">

                        <div class="flex flex-col">
                            <label>Operator</label>
                            <select id="operator" class="border rounded-lg p-2 bg-white">
                                <option>Orange</option>
                                <option>IAM</option>
                                <option>Inwi</option>
                            </select>
                        </div>

                        <div class="flex flex-col">
                            <label>Phone number</label>
                            <input id="phone" type="number" placeholder="+212..."
                                class="border rounded-lg p-2 bg-white" />
                        </div>

                        <div class="flex flex-col">
                            <label>Price</label>
                            <select id="price" class="border rounded-lg p-2 bg-white">
                                <option>10DH</option>
                                <option>20DH</option>
                                <option>50DH</option>
                                <option>100DH</option>
                                <option>150DH</option>
                                <option>200DH</option>
                                <option>250DH</option>
                                <option>300DH</option>
                            </select>
                        </div>

                        <div class="flex flex-col">
                            <label>Type</label>
                            <select id="recType" class="border rounded-lg p-2 bg-white">
                                <option>internet</option>
                                <option>recharge</option>
                            </select>
                        </div>

                        <div class="flex flex-col col-span-2">
                            <label>Date</label>
                            <input id="recDate" type="date" class="border rounded-lg p-2 bg-white" />
                        </div>
                    </form>

                    <div class="flex gap-4 mt-6">
                        <button id="recValidate"
                            class="bg-white px-6 py-2 rounded hover:bg-green-300">Validation</button>
                        <button id="recCancel" class="bg-white px-6 py-2 rounded hover:bg-red-300">Cancel</button>
                    </div>
                </div>
            </section>

            <!-- INVOICE -->
            <section>
                <h2 class="text-2xl font-semibold mb-4">Invoice</h2>

                <!-- Invoice types -->
                <div class="flex gap-4 mb-4">
                    <button class="factType px-4 py-1 text-gray-600 hover:text-blue-400"
                        id="ftElectricity">Electricity</button>
                    <button class="factType px-4 py-1 text-gray-600 hover:text-blue-400" id="ftWater">Water</button>
                    <button class="factType px-4 py-1 text-gray-600 hover:text-blue-400" id="ftInsurance">Car
                        Insurance</button>
                    <button class="factType px-4 py-1 text-gray-600 hover:text-blue-400" id="ftTax">Tax</button>
                </div>

                <div class="bg-gradient-to-r from-blue-300 to-blue-600 shadow-lg rounded-2xl p-6 w-[70%]">
                    <form id="invoiceForm" class="grid grid-cols-3 gap-6">

                        <div class="flex flex-col">
                            <label>N° Contract</label>
                            <input id="contract" type="number" placeholder="123456"
                                class="border rounded-lg p-2 bg-white" />
                        </div>

                        <div class="flex flex-col">
                            <label>Amount</label>
                            <input id="amount" type="number" class="border rounded-lg p-2 bg-white" />
                        </div>

                        <div class="flex flex-col">
                            <label>Date</label>
                            <input id="invDate" type="date" class="border rounded-lg p-2 bg-white" />
                        </div>
                    </form>

                    <div class="flex gap-4 mt-6">
                        <button id="invPay" class="bg-white px-6 py-2 rounded hover:bg-green-300">Pay</button>
                        <button id="invCancel" class="bg-white px-6 py-2 rounded hover:bg-red-300">Cancel</button>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <!-- JS -->
    <script>
        // Utility alert
        function alertMsg(msg, type = "green") {
            const box = document.createElement("div");
            box.className = `fixed top-6 right-6 bg-${type}-500 text-white px-4 py-2 rounded shadow-lg`;
            box.textContent = msg;
            document.body.appendChild(box);
            setTimeout(() => box.remove(), 2500);
        }

        // Operator selection
        document.querySelectorAll(".opBtn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".opBtn").forEach(b => b.classList.remove("font-bold", "text-black"));
                btn.classList.add("font-bold", "text-black");
                document.getElementById("operator").value = btn.textContent.trim();
            });
        });

        // Recharge validation
        document.getElementById("recValidate").onclick = () => {
            const data = {
                operator: operator.value,
                phone: phone.value,
                price: price.value,
                type: recType.value,
                date: recDate.value
            };
            if (!data.phone || data.phone.length < 9) return alertMsg("Invalid phone!", "red");
            if (!data.date) return alertMsg("Select date!", "red");

            const store = JSON.parse(localStorage.getItem("recharges") || "[]");
            store.push(data);
            localStorage.setItem("recharges", JSON.stringify(store));

            alertMsg("Recharge saved!");
            phone.value = recDate.value = "";
        };

        document.getElementById("recCancel").onclick = () => {
            phone.value = recDate.value = "";
            alertMsg("Cancelled", "yellow");
        };

        // Invoice type highlight
        document.querySelectorAll(".factType").forEach(b => {
            b.addEventListener("click", () => {
                document.querySelectorAll(".factType").forEach(x => x.classList.remove("text-blue-400", "font-bold"));
                b.classList.add("text-blue-400", "font-bold");
            });
        });

        // Pay invoice
        document.getElementById("invPay").onclick = () => {
            const data = {
                contract: contract.value,
                amount: amount.value,
                date: invDate.value
            };

            if (!data.contract) return alertMsg("Invalid contract!", "red");
            if (!data.amount || data.amount <= 0) return alertMsg("Invalid amount!", "red");
            if (!data.date) return alertMsg("Select date!", "red");

            const store = JSON.parse(localStorage.getItem("factures") || "[]");
            store.push(data);
            localStorage.setItem("factures", JSON.stringify(store));

            alertMsg("Invoice saved!");
            contract.value = amount.value = invDate.value = "";
        };

        document.getElementById("invCancel").onclick = () => {
            contract.value = amount.value = invDate.value = "";
            alertMsg("Cancelled", "yellow");
        };
    </script>
</body>

</html>
