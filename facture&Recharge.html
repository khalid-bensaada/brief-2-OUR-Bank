                <div class="w-full h-full">
                    <div class="p-4  grid grid-cols-2 justify-around py-8 py-6 gap-10">
                        <div class=" relative left-10">

                            <div class="flex justify-center items-center bg-black h-10 w-40 mb-6  rounded-sm ">
                                <h2 class=" text-[#FFFFFF] ">Recharge</h2>
                            </div>
                            <div
                                class="flex flex-col items-start gap-5 relative left-10  ">
                                <div><button  id="btnOrange" class="hover:text-orange-500 cursor-pointer transform-[2]">Orange</button></div>
                                <div><button id="btnIam" class="hover:text-blue-500 cursor-pointer">IAM</button></div>
                                <div><button id="btnInwi" class="hover:text-fuchsia-500">Inwi</button></div>

                        </div>

                            <form action>
                                <div class="flex flex-row  justify-evenly my-6 gap-6 ">
                                    <div>
                                        <div>
                                            <label for="numéro">Phone number</label>
                                        </div>
                                        <div  class="border-2 rounded-lg bg-white" >
                                            <input id="inputPhoneNumber" type="number" name="numéro"
                                                placeholder="+212...">
                                        </div>
                                    </div>
                                    <div>
                                        <div>
                                            <label for>Price</label>
                                        </div>
                                        <div  class="border-2 rounded-lg bg-white">
                                            <select id="selectPrice">
                                                <option value>10DH</option>
                                                <option value>20DH</option>
                                                <option value>50DH</option>
                                                <option value>100DH</option>
                                                <option value>150DH</option>
                                                <option value>200DH</option>
                                                <option value>250DH</option>
                                                <option value>300DH</option>

                                            </select>
                                        </div>
                                    </div>
                                    <div class="">
                                        <div>
                                            <label for>Type</label>
                                        </div>
                                        <div  class="border-2 rounded-lg bg-white">
                                            <select id="selectType" >
                                                <option value>internet</option>
                                                <option value>recharge</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <div><label for>Date</label></div>
                                        <div class="border-2 rounded-lg bg-white mx-"><input id="inputDateRecharge" type="date" name="Date"
                                                placeholder></div>
                                    </div>
                                </div>
                                <div class="m-6 flex justify-center bg-white hover:bg-blue-400 text-black px-4 py-2 rounded-lg cursor-pointer md:w-20 md:ml-60 md:mt-20 "><button id="btnAdd">Add</button></div>

                            </form>
                        </div>
                    </div>

                <div class=" ">
                    <div class="mt-8">
                        <div class="flex justify-center items-center bg-black h-10 w-48 rounded-sm mb-6 relative left-10">
                            <h2 class=" text-[#FFFFFF]">Invoice</h2>
                        </div>
                        <div class="flex flex-row justify-evenly items-center gap-50">
                            <button  id="btnElectricity" class="text-[#808080] hover:text-blue-400 cursor-pointer">Electricity</button>
                            <button id="btnWater" class="text-[#808080] hover:text-blue-400 cursor-pointer">Water</button>
                            <button  id="btnCarInsurance" class="text-[#808080] hover:text-blue-400 cursor-pointer">Car insurance</button>
                            <button  id="btnTax" class="text-[#808080] hover:text-blue-400 cursor-pointer">Tax</button>
                        </div>
                    </div>
                        <div class="flex justify-center mt-20 relative left-30">
                            <div class=" rounded-[20px] w-[600px] p-6 bg-gradient-to-r from-[rgb(93,177,229)] to-[rgb(52,98,127)] text-black text-base shadow-lg">
                         <form action>
                        <div class="flex flex-row  justify-evenly my-6 gap-6 ">
                           
                            <div>
                                <div><label for="contrat">N° Contrat</label></div>
                                <div class="border-2 rounded-lg bg-white"><input id="inputContrat" type="number" name="Contrat" placeholder="123456"></div>
                            </div>
                            <div>
                                <div><label for="amount">Amount</label></div>
                                <div  class="border-2 rounded-lg bg-white"><input id="inputAmount" type="number" name="Amount"></div>
                            </div>

                            <div class>
                                <div class><label for="date">Date</label></div>
                                <div class="border-2 rounded-lg bg-white "><input id="inputDateFacture"  type="date" name="Date"></div>
                            </div>
                        </form>
                        </div>
                        <div class="flex flex-row justify-evenly">
                            <button class="border-2 rounded-lg  py-2 px-4 bg-green-300" id="btnPay">pay</button>
                            <button class="border-2 rounded-lg py-2 px-4 bg-red-300" id="btnCancel">Cancel</button>
                        </div>

                       </div>
