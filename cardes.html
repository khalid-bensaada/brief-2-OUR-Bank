<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <title>YCD_Bank</title>
        <style>
        .card{
            background-image: url(/images/card.svg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
        }
    </style>
    </head>

    <body class="bg-[#45A5E0] w-[100vw] h-[100vh] ">
        <div class="w-[100%] h-[900px] flex justify-center items-center">
            <div class="bg-[#FFFFFF] w-[90%] h-[90%] rounded-3xl flex">
                <!-- Desktop -->
                <nav
                    class="w-[15%] min-h-[100vh] rounded-l-3xl p-[1%] bg-black  hidden md:block">
                    <ul
                        class="h-full grid grid-cols-3 grid-rows-16 justify-center gap-4">
                        <li class="row-end-1 col-span-3 text-center">
                            <img src="/images/OIP_10-removebg-preview.png" alt>
                        </li>
                        <li
                            class="row-end-3 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                            <a href>Home</a>
                        </li>
                        <li
                            class="row-end-5 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                            <a href>Historique</a>
                        </li>
                        <li
                            class="row-end-7 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                            <a href="cardes.html">Cards</a>
                        </li>
                        <li
                            class="row-end-9 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                            <a href>Factures & Recharge</a>
                        </li>
                        <li
                            class="row-end-11 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                            <a href="transactions.html">Transactions</a>
                        </li>
                        <li
                            class="row-end-13 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                            <a href>Profile</a>
                        </li>
                    </ul>
                </nav>

                <!-- mobile -->
                <nav
                    class="fixed border bottom-0 left-0 right-0 bg-black text-white py-3 z-50 md:hidden">
                    <div class="flex items-center justify-around">
                        <button class="flex flex-col items-center p-2">
                            <img src="/images/Group 24.svg" alt>
                        </button>
                        <button class="flex flex-col items-center p-2">
                            <img src="/images/Group 25.svg" alt>
                        </button>
                        <button class="flex flex-col items-center p-2">
                            <img src="/images/Group 26.svg" alt>
                        </button>
                        <button class="flex flex-col items-center p-2">
                            <img src="/images/Group 27 (1).svg" alt>
                        </button>
                    </div>
                </nav>
                <main
                    class="w-full md:rounded-r-3xl rounded-3xl  bg-white h-full flex flex-col">
                    <div class="text-center mt-6">
                        <button
                            class="bg-[#44A7E5] text-white px-8 py-2 rounded-full font-semibold  md: w-[200px] lg:w-[200px] mb-[10%]">
                            My Cards
                        </button>
                    </div>

                    <section
                        class="md:grid md:grid-cols-2 h-fit w-full md:h-[300px] md:gap-[10px]">
                        <div class="rounded-lg h-[20vh]">
                            <div class="text-white min-w-sm h-full flex flex-col justify-between">
                                <div class="flex self-center card h-full w-[60%] md:h-[30.5vh]">
                                    <div class="h-full" id="info-container">

                                    </div>
                                </div>

                            </div>

                            <p class="text-center text-white font-semibold mt-4">Status:Active</p>
                        </div>
                        <div class="rounded-lg h-[20vh]">
                                <div class="flex in-w-sm h-full self-center card w-[24vw] md:h-full opacity-35  ">

                                    <div class="h-full absolut left-20 ">
                                        <img class="w-[20%]"
                                            src="images/plusIcone.png" />
                                    </div>
                                </div>

                        </div>

                    </section>
                    <div class="grid justify-center item-center ">

                        <div
                            class="bg-gradient-to-r w-112 h-full max-w-2xs from-[rgb(93,177,229)] to-[rgb(52,98,127)]  text-white rounded-2xl p-6  ">
                            <h3 class="font-bold text-lg mb-2">Plafond</h3>
                            <h3></h3>
                            <p class="mb-4 text-sm">New plafond:</p>

                        </div>
                        <div class="flex justify-center item-center m-6">
                            <button
                                class="bg-white text-black px-6 py-2 rounded-full  shadow-md hover:bg-">
                                Edit
                            </button>
                        </div>
                    </div>
                </main>
            </div>

        </div>
        <script src="main.js"></script>

    </body>
</html>
