                    </nav>
                    <!-- mobile -->

                    <nav class="fixed bottom-0 left-0 right-0 bg-black text-white py-3 z-50 md:hidden">
            <div class="flex items-center justify-around">
                <button class="flex flex-col items-center p-2">
                    <img src="/images/Group 24.svg" alt="">
                </button>
                <button class="flex flex-col items-center p-2">
                    <img src="/images/Group 25.svg" alt="">

                <button class="flex flex-col items-center p-2">

                   <div class="flex flex-col items-center w-full px-2 ">
                    <div class=" w-[100%] flex justify-center mt-6  md:relative md:left- ">
                        <input class="w-[60%] border border-blue-400 rounded-3xl py-2 px-4 md:w-[25%]" type="text" name="search" placeholder="Search">
                    </div>
                    <div class="md:grid md:grid-cols-2 flex gap-4 text-sm md:gap-4 justify-evenly mt-6 md:ml-6">
                        <button id="btnAddTransactionPerson"
                            class="bg-[#45A5E0]  text-white px-4 py-2 rounded-md cursor-pointer">
                            transfer to Person
                        </button>
                        <button id="btnAddTransactionDeposit" class="bg-[#000000] text-white px-4 py-2 rounded-md cursor-pointer">transfer to Deposit
                        </button>
                    </div>
                     <h3 class="text-[#45A5E0] mt-10 mb-4 text-center  text-xl font-semibold">Bank transfer History</h3>
                    <div id="transactionList"
                        class="flex felx-row w-[100%] md:h-[30%] self-center md:flex flex-col gap-2 md:w-[50%] ">

                    </div>

                    

                    <div id="formPerson"
                        class="hidden border-2 rounded-sm md:w-[600px] p-6 bg-gradient-to-r from-[rgb(93,177,229)] to-[rgb(52,98,127)]  text-black text-base shadow-lg mt-6">
                        <h3
                            class="text-lg font-semibold mb-4 text-white">transfer
                            to Person</h3>
                        <form
                            class="md:flex md:flex-col md:gap-6 bg-white p-6 rounded-md shadow-sm">
                            <label for="beneficiary" class="font-medium">Full name of
                                Beneficiary:</label>
                                <input  class="border rounded-md p-2 w-full" type="text" name="beneficiary" placeholder="beneficiary"  id="beneficiary" />

                            <label for="amountPerson"
                                class="font-medium">Amount:</label>
                            <input type="number" id="amountPerson"
                                placeholder="Enter amount"
                                class="border rounded-md p-2 w-full">
                        </form>
                        <div class="mt-4 flex justify-end">
                            <button id="btnNextPerson"
                                class="bg-[#45A5E0]  text-white px-4 py-2 rounded-md cursor-pointer">Next</button>
                        </div>
                    </div>

            
                        <div id="formDeposit" class="hidden border-2 rounded-sm md:w-[600px] p-6 bg-slate-900 text-black text-base shadow-lg mt-6">
                        <h3 class="text-lg font-semibold mb-4 text-white">Deposit to Account</h3>
                       <div class=" fixed inset-0 backdrop-blur-sm w-full">
                        <div class="w-full flex justify-center items-center">
                            <div class="bg-white p-4 rounded-3xl self-center w-[50%]">
                            <form class=" md:flex md:flex-col md:gap-6  p-6 rounded-md shadow-sm">
                            <label for="amountDeposit" class="font-medium">Amount:</label>
                            <input type="number" id="amountDeposit" placeholder="Enter amount" class="border rounded-md p-2 w-full">
                        </form>
                        <div class="mt-4 flex justify-end">
                            <button id="btnNextDeposit" class="bg-[#45A5E0] text-white px-4 py-2 rounded-md cursor-pointer">Next</button>
                        </div>
                        </div>
                        </div>
                        </div>
                    </div>
                    

                    <div id="formSummary"
                        class="hidden rounded-sm w-[600px] p-6 bg-gradient-to-t from-black-400 to-white-600 text-black text-base shadow-lg mt-6">
                        <div class="bg-white p-6 rounded-sm border">
                            <h3>Summary</h3>
                            <div id="summaryType">Type:</div>
                            <div id="summaryTo">To:</div>
                            <div id="summaryAmount">Amount:</div>
                            <div id="summaryDate">Date:</div>
                        </div>


                        <div class="grid grid-cols-2 mt-6">
                            <button id="btnBackToForm"
                                class="bg-[#45A5E0] text-white px-4 py-2 rounded-md cursor-pointer">Edit</button>
                            <div class="flex justify-end">
                                <button id="btnConfirm"
                                    class="bg-[#45A5E0]  text-white px-4 py-2 rounded-md cursor-pointer">Confirm</button>
                            </div>
                        </div>
                    </div>
                   </div>
                   
                </div>

            <script src="main.js"></script>
