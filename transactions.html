<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>YCD_Bank</title>
</head>
<body class=" bg-[#45A5E0]">
        <div class="bg-[#FFFFFF] w-[90%] h-[800px] m-auto mt-[50px] ">
            <aside>
                <header>
                    <div class="border bg-black w-[15%] h-[800px] rounded-r-lg">
                    </div>
                </header>
            </aside>


        <h3 class="text-white mt-10 mb-4 text-center text-xl font-semibold">Transaction History</h3>
        <div id="transactionList" class="grid grid-cols-1 md:grid-cols-2 gap-4">

        </div>

       

        <div class="flex gap-4 justify-center mt-6">
            <button id="btnAddTransactionPerson" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md cursor-pointer">
                Add Transaction to Person
            </button>
            <button id="btnAddTransactionDeposit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md cursor-pointer">
                Add Transaction to Deposit
            </button>
        </div>

      

        <div id="formPerson" class="hidden border-2 rounded-sm w-[600px] p-6 bg-gradient-to-t from-sky-500 to-indigo-500 text-black text-base shadow-lg mt-6">
            <h3 class="text-lg font-semibold mb-4 text-white">Transaction to Person</h3>
            <form class="flex flex-col gap-6 bg-white p-6 rounded-md shadow-sm">
                <label for="beneficiary" class="font-medium">Select Beneficiary:</label>
                <select id="beneficiary" class="border rounded-md p-2 w-full">
                    <option value="">Choose one</option>
                    <option value="Mohammed Elhamdaoui">Mohammed Elhamdaoui</option>
                    <option value="Khaled Bensaada">Khaled Bensaada</option>
                    <option value="Halima Hamada">Halima Hamada</option>
                </select>

                <label for="amountPerson" class="font-medium">Amount:</label>
                <input type="number" id="amountPerson" placeholder="Enter amount" class="border rounded-md p-2 w-full">
            </form>
            <div class="mt-4 flex justify-end">
                <button id="btnNextPerson" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md cursor-pointer">Next</button>
            </div>
        </div>


        <div id="formDeposit" class="hidden border-2 rounded-sm w-[600px] p-6 bg-gradient-to-t from-green-500 to-green-700 text-black text-base shadow-lg mt-6">
            <h3 class="text-lg font-semibold mb-4 text-white">Deposit to Account</h3>
            <form class="flex flex-col gap-6 bg-white p-6 rounded-md shadow-sm">
                <label for="amountDeposit" class="font-medium">Amount:</label>
                <input type="number" id="amountDeposit" placeholder="Enter amount" class="border rounded-md p-2 w-full">
            </form>
            <div class="mt-4 flex justify-end">
                <button id="btnNextDeposit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md cursor-pointer">Next</button>
            </div>
        </div>

      
        <div id="formSummary" class="hidden rounded-sm w-[600px] p-6 bg-gradient-to-t from-gray-400 to-gray-600 text-black text-base shadow-lg mt-6">
            <div class="bg-white p-6 rounded-sm border">
                <h3>Summary</h3>
                <div id="summaryType">Type:</div>
                <div id="summaryTo">To:</div>
                <div id="summaryAmount">Amount:</div>
                <div id="summaryDate">Date:</div>
            </div>
            <div class="grid grid-cols-2 mt-6">
                <button id="btnBackToForm" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md cursor-pointer">Edit</button>
                <div class="flex justify-end">
                    <button id="btnConfirm" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md cursor-pointer">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
