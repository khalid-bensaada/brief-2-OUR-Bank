<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
    .active{

        background: linear-gradient(180deg,rgb(123,205,255)0%, rgb(0,74,120)  100%);
        color: white;
    }
</style>
</head>



<body class="bg-gradient-to-tr from-[rgb(123,205,255)] to-[rgb(0,74,120)] min-h-[140vh] py-0 lg:py-10">

    <main
        class="hidden lg:flex w-[90%] min-h-[100vh] absolute top-[5%] left-[5%] rounded-[3vw] overflow-hidden bg-white justify-between container2">
        <nav class="w-[15%] min-h-[100vh] p-[1%] bg-black">
            <ul class="h-full grid grid-cols-3 grid-rows-16 justify-center gap-4">
                <li class="row-end-1 col-span-3 text-center">
                    <img src="/images/OIP_10-removebg-preview.png" alt="">
                </li>
                <li
                    class="row-end-3  col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="">Home</a>
                </li>
                <li
                    class="row-end-5 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors  cursor-pointer">
                    <a href="">Historique</a>
                </li>
                <li
                    class="row-end-7 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="">Cards</a>
                </li>
                <li
                    class="row-end-9 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="">Factures & Recharge</a>
                </li>
                <li
                    class="row-end-11 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="">Transactions</a>
                </li>
                <li
                    class="row-end-13 col-span-3 text-center text-[rgb(212,175,55)] hover:text-white transition-colors cursor-pointer">
                    <a href="">Profile</a>
                </li>
            </ul>
        </nav>

        <section class="w-[85%] p-[2%] flex flex-col gap-3">
            <h1 class="font-semibold font-mono text-2xl">Historique and Transactions</h1>

            <div class="flex w-[50%] justify-between gap-2">
                <button onclick="tout()" 
                    class="border-gray-300 border tout flex-1 py-3 shadow-[4px_4px_4px_rgb(0,0,0,0.2)] rounded-md active hover:opacity-90 transition-opacity">
                    Tout
                </button>
                <button onclick="Virements()"
                    class="border-gray-300 Virements border flex-1 py-3 shadow-[4px_4px_4px_rgb(0,0,0,0.2)] rounded-md hover:bg-gray-50 transition-colors">
                    Virements
                </button>
                <button onclick="Paiements()"  id="Paiements"
                    class="border-gray-300 border flex-1 py-3 shadow-[4px_4px_4px_rgb(0,0,0,0.2)] rounded-md hover:bg-gray-50 transition-colors">
                    Paiements
                </button>
                <button onclick="Recharge()" id="Recharges"
                    class="border-gray-300 border flex-1 py-3 shadow-[4px_4px_4px_rgb(0,0,0,0.2)] rounded-md hover:bg-gray-50 transition-colors">
                    Recharge
                </button>
            </div>

            <label for="Date" class="font-medium">La Date:</label>
            <select name="Date" id="Date"
                class="border border-gray-400 w-[10vw] h-[6vh] rounded-lg shadow-[4px_4px_4px_rgb(0,0,0,0.2)] px-2">
                <option value="" class="text-center">Date</option>
                <option value="Novembre" class="text-center">Novembre</option>
                <option value="Octobre" class="text-center">Octobre</option>
                <option value="Juin" class="text-center">Juin</option>
            </select>

            <div class="space-y-4">
                <div class="border-gray-400 border-2 overflow-hidden rounded-2xl transition-all duration-500 ease-in-out"
                    id="desktopDropdown1">
                    <button class="pl-4 pt-3 pb-3 flex justify-between items-center w-full hover:bg-gray-50"
                        onclick="toggleDesktopDropdown('desktopDropdown1')">
                        <span class="font-semibold text-lg">Novembre 2025</span>
                        <svg class="w-6 h-6 mr-4 transition-transform duration-500" id="desktopArrow1" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <div class="desktop-content" style="display: none;">

                        <div class="border-t border-gray-300 p-4">
                            <p class="text-gray-500 text-center">Aucune transaction</p>
                        </div>

                    </div>
                </div>

                <div class="border-gray-400 border-2 overflow-hidden rounded-2xl transition-all duration-500 ease-in-out"
                    id="desktopDropdown2">
                    <button class="pl-4 pt-3 pb-3 flex justify-between items-center w-full hover:bg-gray-50"
                        onclick="toggleDesktopDropdown('desktopDropdown2')">
                        <span class="font-semibold text-lg">Octobre 2025</span>
                        <svg class="w-6 h-6 mr-4 transition-transform duration-500" id="desktopArrow2" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <section class="lg:hidden bg-gray-50 min-h-screen container2">
        <header class="flex justify-around ">
            <img src="/images/User.svg" alt="">
            <span
                class="bg-[rgb(37,37,37)] text-white flex items-center justify-center w-[50%] rounded-b-lg text-2xl font-bold py-5 shadow-[0_8px_4px_gray] text-shadow-[3px_3px_2px_black]">Historique</span>
            <img src="/images/Icon (1).svg" alt="">
        </header>

        <div class="px-4 py-3 bg-white border-b mt-5">
            <button class="flex items-center text-gray-700 text-sm font-medium">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Retour
            </button>
        </div>

        <main class="px-4 py-4 pb-24">
            <h2 class="text-lg font-semibold mb-4">Historique des transaction</h2>

            <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
                <button onclick="tout()"
                    class="px-4 border-gray-300 py-2 tout active rounded-lg shadow-md whitespace-nowrap text-sm font-medium">
                    Tout
                </button>
                <button onclick="Virements()"
                    class="px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm whitespace-nowrap text-sm font-medium">
                    Virements
                </button>
                <button onclick="Paiements()" id="Paiements"
                    class="px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm whitespace-nowrap text-sm font-medium">
                    Paiements
                </button>
                <button onclick="Recharge()" id="Recharges"
                    class="px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm whitespace-nowrap text-sm font-medium">
                    Recharges
                </button>
            </div>

            <div class="mb-4" id="container">
                <button
                    class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 flex items-center justify-between shadow-sm"
                    onclick="toggleMobileDropdown('dropdown1')">
                    <div class="flex items-center">
                        <span class="mr-2">▼</span>
                        <span class="font-medium">Novembre 2025</span>
                    </div>
                    <svg class="w-5 h-5 transform transition-transform" id="arrow1" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>

                <div id="dropdown1"
                    class="desktop-content mt-3 space-y-3 max-h-0 overflow-hidden transition-all duration-300">





                </div>
            </div>

            <div class="mb-4">
                <button
                    class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 flex items-center justify-between shadow-sm"
                    onclick="toggleMobileDropdown('dropdown2')">
                    <div class="flex items-center">
                        <span class="mr-2">▼</span>
                        <span class="font-medium">Octobre 2025</span>
                    </div>
                    <svg class="w-5 h-5 transform transition-transform rotate-180" id="arrow2" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div id="dropdown2" class="mt-3 space-y-3 max-h-0 overflow-hidden transition-all duration-300"></div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black text-white py-3 z-50">
            <div class="flex items-center justify-around">
                <button class="flex flex-col items-center p-2">
                    <img src="/images/Group 24.svg" alt="">
                </button>
                <button class="flex flex-col items-center p-2">
                    <img src="/images/Group 25.svg" alt="">
                </button>
                <button class="flex flex-col items-center p-2">
                    <img src="/images/Group 26.svg" alt="">
                </button>
                <button class="flex flex-col items-center p-2">
                    <img src="/images/Group 27 (1).svg" alt="">
                </button>
            </div>
        </nav>
    </section>

    <script src="main.js">

    </script>
</body>

</html>
