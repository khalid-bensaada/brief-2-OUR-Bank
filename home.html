<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Home</title>
</head>

<body class="overflow-x-hidden bg-[#45A5E0]">
    <div class="bg-[#FFFFFF] w-[90%] h-[900px] m-auto rounded-[50px] mt-[50px]">
        <header class=" bg-black w-[15%] h-[900px] rounded-tl-[50px] rounded-bl-[50px]"></header>
        <div class="flex justify-center items-center ">
            <div
                class=" relative  bottom-[850px] left-[8%] rounded-[25px] border border-black w-[60%] h-[300px] bg-black">
                <div class="relative left-[7%] top-[20px] ">
                    <p class="font-bold text-[#FFFFFF] text-xl">My Card</p>
                </div>
                <div>

                </div>
                <div class="flex ">
                    <div class="relative left-[26%] top-[60px] ">
                        <img src="images/Tarjeta 3.png" alt="card of bank">
                        <p id="rib"></p>
                        <p id="total"></p>
                        <img src="" alt="">
                        <p id="noom"></p>
                    </div>
                </div>
            </div>
        </div>
        <div>
            <div
                class="bg-white border border-gray-300 shadow-xl rounded-2xl p-6 w-[350px] hover:shadow-2xl transition duration-300">
                <h2 class="text-xl font-bold mb-4 text-center text-gray-800"> Currency Exchange Rates</h2>

                <div class="flex justify-between border-b border-gray-200 py-2">
                    <span class="font-medium text-gray-600">🇺🇸 USD / MAD</span>
                    <span class="font-semibold text-green-600">10.12 <span class="text-green-400">+0.04</span></span>
                </div>

                <div class="flex justify-between border-b border-gray-200 py-2">
                    <span class="font-medium text-gray-600">🇪🇺 EUR / MAD</span>
                    <span class="font-semibold text-red-600">10.85 <span class="text-red-400">-0.02</span></span>
                </div>

                <div class="flex justify-between border-b border-gray-200 py-2">
                    <span class="font-medium text-gray-600">🇬🇧 GBP / MAD</span>
                    <span class="font-semibold text-green-600">12.65 <span class="text-green-400">+0.10</span></span>
                </div>

                <div class="flex justify-between pt-2">
                    <span class="font-medium text-gray-600">🇸🇦 SAR / MAD</span>
                    <span class="font-semibold text-gray-700">2.69 <span class="text-gray-400">0.00</span></span>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
