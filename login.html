<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<style>
    .swal2-container {
        backdrop-filter: blur(10px);
        background-color: rgba(0, 0, 0, 0.9) !important;
    }
</style>

<body class="flex relative justify-center items-center border-black border-2 w-[100%] h-[100VH] bg-[rgb(69,165,224)]">
    <main
        class=" hidden lg:flex w-[80%] h-[80%] rounded-2xl overflow-hidden flex bg-white container1 shadow-[0px_0px_15px_black]">
        <div class="relative w-2/5 h-full flex flex-col justify-center items-center text-center overflow-hidden">
            <video autoplay muted loop playsinline class="absolute top-0 left-0 w-full h-full object-cover">
                <source src="/images/4954761_Coll_halloween_Dusty_6144x3456.mp4" type="video/mp4" />
            </video>

            <div class="absolute inset-0 bg-black/40"></div>

            <div class="relative z-10">
                <h1 class="text-white text-5xl font-extrabold mb-4">Log in</h1>
                <h2 class="text-white text-3xl font-bold">Welcome to our bank</h2>
            </div>
        </div>
        <div class="grid grid-rows-16 w-[100%] items-center justify-center">
            <div class="flex flex-col gap-2 row-end-5">
                <label for="email" class="text-lg w-[19vw]">Email</label>
                <input type="text" name="email" id="email"
                    class="border-gray-300 border-[1px] rounded w-[30vw] h-10 focus:outline-none px-2 focus:border-gray-500"
                    title="example@gmail.com">
            </div>
            <div class="flex flex-col gap-2 row-end-9">
                <label for="password" class="w-[19vw] text-lg">password</label>
                <input type="text" name="password" id="password"
                    class="border-gray-300 border-[1px] rounded w-[30vw] h-10 focus:outline-none px-2 focus:border-gray-500"
                    title="it should be 8 letters at least and at least 1 upper or lower case caracter">
            </div>
            <div class="row-end-12 flex flex-col gap-3 mt-5 text-sm font-normal">
                <h1><input type="checkbox" class="text-blue-500 accent-blue-500" name="remembre" id="remembre"> Remembre
                    me</h1>
                <h1 class="">Forget password?</h1>
                <h1>Don't have an account? <a href="signup.html" class="text-blue-900 font-bold">SignUp</a></h1>
            </div>
            <div class="row-end-15 flex justify-evenly">
                <button
                    class="bg-green-300 w-[25%] py-[2%] rounded hover:shadow-[0px_0px_10px_gray] hover:translate-y-[-2px] hover:bg-white hover:text-green-500 transition-all active:translate-y-[0] active:shadow-none"
                    onclick="validateInfos()">Confirmer</button>
                <button
                    class="bg-red-300 w-[25%] py-[2%] rounded hover:shadow-[0px_0px_10px_gray] hover:translate-y-[-2px] hover:bg-white hover:text-red-500 transition-all active:translate-y-[0] active:shadow-none">Annuleé</button>
            </div>
        </div>
    </main>

    <section class="lg:hidden overflow-hidden w-screen container2">
        <header class="relative h-[20vh] flex items-center justify-center overflow-hidden">
            <video autoplay muted loop playsinline class="absolute top-0 left-0 w-full h-full object-cover">
                <source src="/images/4954761_Coll_halloween_Dusty_6144x3456.mp4" type="video/mp4" />
            </video>

            <div class="absolute inset-0 bg-black/40"></div>

            <h1 class="relative text-white text-3xl text-center w-[80%] font-bold z-10">
                Welcome to our Login page
            </h1>
        </header>
        <main
            class="h-[80vh] bg-linear-to-tr from-[rgb(0,74,119)] to-[rgb(69,165,224)] flex items-center justify-center ">
            <div class="h-[90%] w-[80%] bg-white grid grid-rows-16 rounded-lg">
                <div class="flex flex-col items-center gap-2 w-[100%] row-end-4 row-span-2">
                    <label for="email" class="text-lg w-[80%]">Email</label>
                    <input type="text" name="email" id="phone-email"
                        class="border-gray-300 border-[1px] rounded w-[80%] focus:outline-none px-1 focus:border-gray-500">
                </div>
                <div class="flex flex-col items-center gap-2 row-end-8 row-span-2">
                    <label for="password" class="text-lg w-[80%]">password</label>
                    <input type="text" name="password" id="phone-password"
                        class="border-gray-300 border-[1px] rounded w-[80%] focus:outline-none px-1 focus:border-gray-500">
                </div>
                <div class="row-end-11 flex flex-col ml-8 gap-3 text-xs font-normal">
                    <h1><input type="checkbox" class="text-blue-500 accent-blue-500" name="remembre" id="remembre">
                        Remembre me</h1>
                    <h1 class="ml-4">Forget password?</h1>
                    <h1 class="ml-4">Don't have an account? <a href="signup.html"
                            class="text-blue-900 font-bold">SignUp</a></h1>
                </div>
                <div class="row-end-16 flex justify-evenly">
                    <button
                        class="bg-[rgb(0,157,255)] w-[40%] py-[2%] rounded transition-all shadow-[inset_4px_4px_4px_rgb(0,0,0,0.4),4px_4px_4px_rgb(0,0,0,0.4)]  active:translate-y-[1px] active:shadow-none flex justify-center items-center font-semibold"
                        onclick="validateInfos()">Confirmer</button>
                    <button
                        class="bg-[rgb(123,204,255)] w-[40%] py-[2%] rounded transition-all active:translate-y-[1px] active:shadow-none flex justify-center items-center shadow-[inset_4px_4px_4px_rgb(0,0,0,0.4),4px_4px_4px_rgb(0,0,0,0.4)] font-semibold">Annuleé</button>
                </div>
            </div>
        </main>
    </section>
    <script src="main.js"></script>
</body>

</html>
